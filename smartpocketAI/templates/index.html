<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>PocketSmart AI</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

<div class="container">

```
<header>
    <h1>💰 PocketSmart AI</h1>
    <p>Your Smart Budget & Recommendation Assistant</p>
</header>

<section class="card">

    <h2>Enter Your Budget Details</h2>

    <label>Total Budget (₹)</label>
    <input
        type="number"
        id="budget"
        placeholder="Example: 10000"
    >

    <label>Category</label>

    <select id="category">

        <option value="Shopping">
            Shopping
        </option>

        <option value="Event">
            Event
        </option>

        <option value="Home Decor">
            Home Decor
        </option>

        <option value="Other">
            Other
        </option>

    </select>

    <label>What do you need?</label>

    <input
        type="text"
        id="requirement"
        placeholder="Example: Birthday party"
    >

    <label>Your preference</label>

    <input
        type="text"
        id="preference"
        placeholder="Example: Low cost and simple"
    >

    <button onclick="getRecommendation()">
        Get AI Recommendation
    </button>

</section>


<section id="result" class="result">

    <h2>Recommendation</h2>

    <div id="allocation"></div>

    <div id="aiResult"></div>

</section>
```

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
